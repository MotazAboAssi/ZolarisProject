{% extends "base.html" %}

{% block title %}Shopping Cart — MiniShop{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <div class="card border-0 shadow-sm text-center">
      <div class="card-body p-5">
        <i class="bi bi-cart3 display-4 text-primary" aria-hidden="true"></i>
        <h1 class="h3 fw-bold mt-3">Shopping Cart</h1>
        <p class="text-muted mb-4">
          This placeholder view is reserved for the <code>orders</code> module
          (cart management and checkout flow).
        </p>
        <a href="{% url 'store:product-list' %}" class="btn btn-primary">
          Continue Shopping
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
